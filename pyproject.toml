[project]
name = "disko"
version = "1.4.4"
description = "Discrete Sky Operator (DiSkO) Aperture Synthesis Radio Imaging"
authors = [
    {name = "Tim Molteno",email = "tim@elec.ac.nz"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.2.1,<3.0.0",
    "matplotlib>=3.1.0,<4.0.0",
    "healpy>=1.15.0,<2.0.0",
    "tart>=1.4.0",
    "tart-tools>=1.4.0",
    "h5py>=3.7",
    "scipy>=1.7.3",
    "astropy>=5.2",
    "svgwrite>=1.4.3",
    "scikit-learn>=1.0.1",
    "pylops>=2.0",
    "toolz>=0.11.2",
    "imageio>=0.6.0b1",
    "dask-ms>=0.2.25,<0.3.0",
    # Issue #23: disko/ms_helper.py opens measurement sets itself, so declare
    # the table library directly instead of relying on dask-ms to install
    # python-casacore (which dask-ms 0.3 drops in favour of arcae). casacure
    # is the Rust replacement, and has no compiled python-casacore dependency.
    "casacure>=3.8",
    "angle-parser>=0.2.0",
]

[project.optional-dependencies]
ms = [
    "tart2ms>=0.9.0",
]
mesh = [
    "gmsh>=4.0",
    "meshio>=5.0",
]

[dependency-groups]
dev = [
    "flake8>=7.1.2",
    "pytest>=8",
    # Release automation (tasks.py): invoke is the task runner, plumbum the
    # shell-command plumbing `invoke release` uses for the version bump, the
    # tag push and the chain into the tools and tart_cargo repos.
    "invoke>=3.0",
    "plumbum>=2.0",
]

[tool.pytest.ini_options]
addopts = "--ignore=context"

[project.scripts]
disko = "disko.cli:main"
disko_draw = "disko.draw_cli:main"
disko_svd = "disko.svd_cli:main"
disko_bayes = "disko.bayes_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
