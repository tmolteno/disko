[project]
name = "disko"
version = "1.4.4"
description = "Discrete Sky Operator (DiSkO) Aperture Synthesis Radio Imaging"
authors = [
    {name = "Tim Molteno",email = "tim@elec.ac.nz"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.2.1,<3.0.0",
    "matplotlib>=3.1.0,<4.0.0",
    "healpy>=1.15.0,<2.0.0",
    "tart>=1.4.0",
    "tart-tools>=1.4.0",
    "h5py>=3.7",
    "scipy>=1.7.3",
    "astropy>=5.2",
    "svgwrite>=1.4.3",
    "scikit-learn>=1.0.1",
    "pylops>=2.0",
    "toolz>=0.11.2",
    "imageio>=0.6.0b1",
    # dask-ms-2 is tmolteno's casacure-backed fork of dask-ms 0.2.x
    # (github.com/tmolteno/dask-ms; same `daskms` import package, published
    # under its own name because PyPI rejects direct-URL dependencies). From
    # 0.2.34 casacure is its table backend unconditionally, so installing it
    # brings casacure and never python-casacore -- unlike upstream dask-ms
    # 0.2.x, whose hard dependency this used to pull in (upstream 0.3 moves
    # to arcae). dask[array], which disko uses directly, comes from here too.
    "dask-ms-2>=0.2.34,<0.3.0",
    # Issue #23: disko/ms_helper.py opens measurement sets itself, so declare
    # the table library directly rather than only via dask-ms. casacure is
    # the pure-Rust casacore replacement; no compiled python-casacore.
    "casacure>=3.8",
    "angle-parser>=0.2.0",
]

[project.optional-dependencies]
ms = [
    "tart2ms>=0.9.0",
]
mesh = [
    "gmsh>=4.0",
    "meshio>=5.0",
]

[dependency-groups]
dev = [
    "flake8>=7.1.2",
    "pytest>=8",
    # Release automation (tasks.py): invoke is the task runner, plumbum the
    # shell-command plumbing `invoke release` uses for the version bump, the
    # tag push and the chain into the tools and tart_cargo repos.
    "invoke>=3.0",
    "plumbum>=2.0",
]

[tool.pytest.ini_options]
addopts = "--ignore=context"

[project.scripts]
disko = "disko.cli:main"
disko_draw = "disko.draw_cli:main"
disko_svd = "disko.svd_cli:main"
disko_bayes = "disko.bayes_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
